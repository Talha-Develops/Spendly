<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spendly</title><meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171f;--mu:#6b7280;--bd:#e8eaee;--g:#16a34a;--r:#dc2626;--n:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a21;--tx:#f1f3f7;--mu:#9aa1ae;--bd:#262b35;--g:#22c55e;--r:#f87171;--n:#818cf8}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a21;--tx:#f1f3f7;--mu:#9aa1ae;--bd:#262b35;--g:#22c55e;--r:#f87171;--n:#818cf8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100%}
#app{max-width:520px;margin:auto;padding:16px 16px 150px}
.v{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
h1{font-size:2.4rem;letter-spacing:-1px}h2{font-size:1.5rem;margin-bottom:12px}h3{font-size:1rem;margin-bottom:10px}h4{color:var(--mu);font-size:.8rem;margin:14px 0 4px}
small{color:var(--mu);display:block;font-size:.8rem}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two h2{margin:4px 0 0;font-size:1.3rem}
.gr{color:var(--g)}.rd{color:var(--r)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:3px;margin-bottom:14px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:11px;font:inherit;font-size:.85rem;transition:.2s}
.seg .on{background:var(--n);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}.row>div{flex:1;min-width:0}.row small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row i,.rw i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:1.2rem}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0}.rw2{display:flex;gap:6px;align-items:center}
.dn{position:relative;height:200px}.lg{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0}
.lg b{font-weight:500}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.em{color:var(--mu);text-align:center;padding:22px 8px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.fl{display:flex;gap:8px}.big{font-size:2rem;font-weight:700;text-align:center}
input.bi{width:100px;margin:0;padding:7px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:7px 12px;border:1px solid var(--bd);border-radius:20px;font-size:.85rem;cursor:pointer}.chip.on{border-color:var(--n);background:var(--n);color:#fff}
button.pr,button.gh,label.gh{padding:13px 18px;border-radius:14px;border:1px solid var(--bd);font:inherit;cursor:pointer;background:none;color:var(--tx);display:inline-block}
button.pr{background:var(--n);color:#fff;border:0;flex:1}.bt{display:flex;gap:10px}.dg{width:100%;color:var(--r)}
.x{border:0;background:none;font-size:1rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 0;color:var(--mu);font:inherit;font-size:.7rem}nav button span{display:block;font-size:1.3rem}nav .on{color:var(--n)}
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--n);color:#fff;font-size:2rem;box-shadow:0 6px 18px rgba(79,70,229,.4);transition:transform .15s}.fab:active{transform:scale(.92)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:u .25s ease}@keyframes u{from{transform:translateY(60px);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:11px 16px;border-radius:14px;z-index:10;display:flex;gap:14px;align-items:center;white-space:nowrap}#toast button{background:none;border:0;color:#a5b4fc;font:inherit;font-weight:600}

.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.05)}
.hero{background:linear-gradient(135deg,#0f766e,#4f46e5);color:#fff;border:0;padding:22px 20px}.hero small{color:rgba(255,255,255,.75)}
.hd{margin:4px 0 16px}.hd h2{margin:0;font-size:1.7rem}
.two .card{display:flex;gap:12px;align-items:center;padding:14px}.two .card>div{min-width:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}
.ic.g{background:#16a34a22;color:var(--g)}.ic.r{background:#dc262622;color:var(--r)}
.ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.ct b{font-size:1.3rem}
.fab{background:linear-gradient(135deg,#6366f1,#4f46e5);z-index:5;width:64px;height:64px}
nav{z-index:5;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav .on span{background:color-mix(in srgb,var(--n) 15%,transparent);border-radius:14px;padding:2px 18px;display:inline-block}
#be.on{background:var(--r)}#bi.on{background:var(--g)}
.sh:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--bd);margin:-8px auto 14px}
.row{border-radius:12px;transition:opacity .15s}.row:active,.chip:active{opacity:.6}.row+.row{border-top:1px solid var(--bd)}
.big{border:0;background:none;font-size:2.6rem;padding:6px;margin-bottom:6px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--n);outline-offset:2px}
button,select,input,.row,nav button{min-height:44px}.seg button{min-height:40px}
input[type=checkbox]{min-height:0;height:22px;width:22px!important;margin:0}
button.chip{background:none;color:inherit;font:inherit;min-height:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<button class="fab" onclick="openForm()" aria-label="Add transaction">+</button>
<nav><button data-v="home" onclick="nv('home')"><span>🏠</span>Home</button><button data-v="tx" onclick="nv('tx')"><span>🧾</span>Transactions</button><button data-v="bill" onclick="nv('bill')"><span>🔔</span>Bills</button><button data-v="rep" onclick="nv('rep')"><span>📊</span>Reports</button><button data-v="set" onclick="nv('set')"><span>⚙️</span>Settings</button></nav>
<script>
const $=s=>document.querySelector(s),fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
IC=['🎁','✈️','📚','🐶','💡','🎮','☕'],CL=['#ec4899','#14b8a6','#a855f7','#eab308','#06b6d4','#f43f5e','#84cc16'],
fresh=()=>({tx:[],bud:{},theme:'auto',last:'',cats:[['Food','🍔','#f97316'],['Transport','🚌','#3b82f6'],['Rent','🏠','#8b5cf6'],['Bills','🧾','#ef4444'],['Shopping','🛍️','#ec4899'],['Health','💊','#14b8a6'],['Entertainment','🎬','#eab308'],['Salary','💼','#16a34a'],['Other','📦','#6b7280']].map((c,i)=>({id:'c'+i,name:c[0],icon:c[1],color:c[2]}))});
let db;try{db=JSON.parse(localStorage.getItem('sp1'))||fresh()}catch(e){db=fresh()}
const save=()=>{try{localStorage.setItem('sp1',JSON.stringify(db))}catch(e){}},
pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},
ym=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.getFullYear()+'-'+pad(d.getMonth()+1)},
cat=id=>db.cats.find(c=>c.id==id)||{name:'Deleted',icon:'❓',color:'#9ca3af',id:''},
sum=(l,t)=>l.filter(x=>x.type==t).reduce((a,x)=>a+x.amount,0),
cmp=(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id),
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
dl=d=>d==today()?'Today':new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}),
inMo=t=>mo=='all'||t.date.slice(0,7)==ym(mo=='this'?0:-1),
byCat=l=>{const m={};l.filter(t=>t.type=='expense').forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])},
th=()=>{const r=document.documentElement;db.theme=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=db.theme},
row=t=>{const c=cat(t.category),n=t.type=='income';return `<div class=row role=button tabindex=0 onkeydown="if(event.key=='Enter')this.click()" onclick="openForm('${t.id}')"><i style="background:${c.color}26">${c.icon}</i><div><b>${esc(c.name)}</b><small>${t.cur&&t.cur!='INR'?t.oamt+' '+t.cur+' · ':''}${esc(t.note||dl(t.date))}</small></div><b class="${n?'gr':'rd'}">${n?'+':'−'}${fmt(t.amount)}</b></div>`},
EM='<p class=em>No transactions yet.<br>Tap + to add your first one.</p>';
let v='home',mo='this',F={},ch=[],dcb,ty,sel,tm;
const nv=x=>{F={q:'',t:'',c:'',a:'',b:''};go(x)},refresh=()=>v=='tx'?lst():go(),mu=()=>getComputedStyle(document.documentElement).getPropertyValue('--mu').trim();
function go(x){if(x)v=x;ch.forEach(c=>c.destroy());ch=[];$('#app').innerHTML=`<div class=v>${V[v]()}</div>`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(V[v+'_'])V[v+'_']();scrollTo(0,0)}
const V={
home(){const l=db.tx.filter(inMo),i=sum(l,'income'),e=sum(l,'expense'),all=sum(db.tx,'income')-sum(db.tx,'expense'),d=byCat(l),
bs=db.cats.filter(c=>db.bud[c.id]>0).map(c=>{const s=sum(db.tx.filter(t=>t.category==c.id&&t.date.slice(0,7)==ym(0)),'expense'),b=db.bud[c.id],p=s/b*100;return `<div class=rw><span>${c.icon} ${esc(c.name)}</span><small>${fmt(s)} / ${fmt(b)}</small></div><div class=bar><i style="width:${Math.min(p,100)}%;background:${p>=80?'var(--r)':'var(--g)'}"></i></div>`}).join('');
return `<div class="hd rw"><div><small>Welcome back 👋</small><h2>Spendly</h2></div><button class=gh onclick=ask() aria-label="Ask or add by text or voice">✨ Ask</button></div><div class=seg>${[['this','This month'],['last','Last month'],['all','All time']].map(([k,t])=>`<button class="${mo==k?'on':''}" onclick="mo='${k}';go()">${t}</button>`).join('')}</div>
<div class='card hero'><small>Current balance${mo=='all'?'':' · all time'}</small><h1>${fmt(all)}</h1></div>
<div class=two><div class=card><span class='ic g'>↓</span><div><small>Income</small><h2 class=gr>${fmt(i)}</h2></div></div><div class=card><span class='ic r'>↑</span><div><small>Expenses</small><h2 class=rd>${fmt(e)}</h2></div></div></div>
${alerts()}<div class=card><h3>Spending by category</h3>${d.length?`<div class=dn><canvas id=dn></canvas><div class=ct><small>Spent</small><b>${fmt(e)}</b></div></div><div style="margin-top:10px">${d.slice(0,5).map(x=>`<div class=lg><span><span class=dot style="background:${cat(x[0]).color}"></span>${esc(cat(x[0]).name)}</span><b>${fmt(x[1])} · ${Math.round(x[1]/e*100)}%</b></div>`).join('')}</div>`:'<p class=em>No spending in this period.</p>'}</div>
${bgs()}
<div class=card><h3>Recent transactions</h3>${db.tx.length?[...db.tx].sort(cmp).slice(0,10).map(row).join(''):EM}</div>`},
home_(){const d=byCat(db.tx.filter(inMo));if(!window.Chart||!d.length)return;ch.push(new Chart($('#dn'),{type:'doughnut',data:{labels:d.map(x=>cat(x[0]).name),datasets:[{data:d.map(x=>x[1]),backgroundColor:d.map(x=>cat(x[0]).color),borderWidth:0}]},options:{cutout:'68%',maintainAspectRatio:false,plugins:{legend:{display:false}}}}))},
tx(){return `<h2>Transactions</h2><input id=q placeholder="🔍 Search notes or categories" oninput="F.q=this.value;lst()">
<div class=fl><select onchange="F.t=this.value;lst()"><option value="">All types<option value=income>Income<option value=expense>Expense</select><select onchange="F.c=this.value;lst()"><option value="">All categories${db.cats.map(c=>`<option value=${c.id}>${esc(c.name)}`).join('')}</select></div>
<div class=fl><input type=date onchange="F.a=this.value;lst()" title="From"><input type=date onchange="F.b=this.value;lst()" title="To"></div><div class=fl><select aria-label=Account onchange="F.k=this.value;lst()"><option value="">All accounts${db.accts.map(a=>`<option value=${a.id}>${esc(a.name)}`).join('')}</select><select aria-label="Tax tag" onchange="F.x=this.value;lst()"><option value="">All tax tags<option value=1>Tax-deductible</select></div><div class=card id=lst></div>`},
tx_(){lst()},
rep(){return `<h2>Reports</h2>${summ()}<div class=card><h3>Income vs expenses · last 6 months</h3><div class=dn><canvas id=bc></canvas></div></div><div class=card><h3>Top spending categories</h3>${(()=>{const d=byCat(db.tx.filter(t=>t.date.slice(0,7)>=ym(-5))).slice(0,6);return d.length?d.map(x=>`<div class=rw><span>${cat(x[0]).icon} ${esc(cat(x[0]).name)}</span><b>${fmt(x[1])}</b></div><div class=bar><i style="width:${x[1]/d[0][1]*100}%;background:${cat(x[0]).color}"></i></div>`).join(''):'<p class=em>Add some expenses to see your top categories.</p>'})()}</div>`},
rep_(){if(!window.Chart)return;const m=[0,1,2,3,4,5].map(k=>ym(k-5)),f=t=>m.map(x=>sum(db.tx.filter(y=>y.date.slice(0,7)==x),t)),c=mu(),gc=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
ch.push(new Chart($('#bc'),{type:'bar',data:{labels:m.map(x=>new Date(x+'-01T00:00').toLocaleString('en-IN',{month:'short'})),datasets:[{label:'Income',data:f('income'),backgroundColor:'#16a34a',borderRadius:6},{label:'Expenses',data:f('expense'),backgroundColor:'#dc2626',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:c}}},scales:{x:{ticks:{color:c},grid:{display:false}},y:{ticks:{color:c},grid:{color:gc}}}}}))},
set(){return `<h2>Settings</h2><div class=card><div class=rw><span>Currency</span><b>₹ INR</b></div><div class=rw><span>Theme</span><select style="width:auto;margin:0" onchange="db.theme=this.value;save();th();go()">${['auto','light','dark'].map(x=>`<option ${db.theme==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class=card><div class=rw><h3>Categories &amp; monthly budgets</h3><button class=gh style="padding:7px 12px" onclick=addCat()>+ Add</button></div>${db.cats.map(c=>`<div class=rw><span onclick="ren('${c.id}')" style="cursor:pointer">${c.icon} ${esc(c.name)} ✎</span><span class=rw2>${c.id!='c7'?`<input class=bi type=number inputmode=decimal placeholder="Budget ₹" value="${(db.bg.find(b=>b.cat==c.id&&b.per=='month')||{}).limit||''}" onchange="bud('${c.id}',this.value)">`:''}${c.id!='c8'?`<button class=x onclick="rm('${c.id}')">🗑</button>`:''}</span></div>`).join('')}</div>
<div class=card><div class=bt><button class=gh onclick=exp()>⬇ Export CSV</button><label class=gh>⬆ Import CSV<input type=file accept=".csv,text/csv" hidden onchange=imp(this)></label></div></div>
${extra()}<button class="gh dg" onclick=wipe()>Delete all data</button>`}};
function lst(){const q=(F.q||'').toLowerCase();let h='',d='';const l=db.tx.filter(t=>(!F.t||t.type==F.t)&&(!F.c||t.category==F.c)&&(!F.a||t.date>=F.a)&&(!F.b||t.date<=F.b)&&(!F.k||t.acct==F.k)&&(!F.x||t.tax)&&(!q||(t.note+cat(t.category).name).toLowerCase().includes(q))).sort(cmp);
l.forEach(t=>{if(t.date!=d){d=t.date;h+=`<h4>${dl(d)}</h4>`}h+=row(t)});$('#lst').innerHTML=h||(db.tx.length?'<p class=em>No matching transactions.</p>':EM)}
function sheet(h){closeS();const o=document.createElement('div');o.id='ov';o.onclick=e=>{if(e.target==o)closeS()};o.innerHTML=`<div class=sh>${h}</div>`;document.body.append(o)}
const closeS=()=>$('#ov')&&$('#ov').remove();
function dlg(t,cb,inp){dcb=cb;sheet(`<h3>${t}</h3>${inp!=null?`<input id=di value="${esc(inp)}">`:''}<div class=bt><button class=gh onclick=closeS()>Cancel</button><button class=pr onclick=dok()>OK</button></div>`);if(inp!=null)$('#di').focus()}
function dok(){const e=$('#di'),x=e&&e.value;closeS();dcb(x)}
function toast(m,u){clearTimeout(tm);$('#toast')&&$('#toast').remove();const e=document.createElement('div');e.id='toast';e.setAttribute('role','status');e.innerHTML=esc(m)+(u?'<button>Undo</button>':'');if(u)e.querySelector('button').onclick=()=>{u();e.remove()};document.body.append(e);tm=setTimeout(()=>e.remove(),5000)}
function openForm(id,p){const t=id?db.tx.find(x=>x.id==id):null;ty=t?t.type:'expense';sel=t?t.category:(cat(db.last).id?db.last:db.cats[0].id);
sheet(`<h3>${t?'Edit':'New'} transaction</h3><div class=seg><button id=be onclick="tt('expense')">Expense</button><button id=bi onclick="tt('income')">Income</button></div>
<input id=a type=number inputmode=decimal step=any min=0 placeholder="0" aria-label="Amount" class=big value="${t?(t.oamt||t.amount):''}"><div class=fl><select id=cu aria-label=Currency onchange=cr(1)>${CU.map(c=>`<option>${c}`).join('')}</select><input id=rt type=number inputmode=decimal step=any placeholder="Rate: ₹ per 1 unit" aria-label="Exchange rate to rupees" hidden></div><div class=chips id=ch2></div>
<div class=fl><input id=d type=date value="${t?t.date:today()}"><input id=n placeholder="Note (optional)" aria-label=Note value="${t?esc(t.note):''}"></div><div class=fl><select id=ac aria-label=Account><option value="">Account${db.accts.map(a=>`<option value=${a.id}>${esc(a.name)}`).join('')}</select><label class=rw style="gap:8px;white-space:nowrap"><input type=checkbox id=tx ${t&&t.tax?'checked':''}>Tax-deductible</label></div>
<p id=er class=rd style="margin-bottom:8px"></p><div class=bt>${t?`<button class=gh onclick="del('${id}')">Delete</button>`:''}<button class=pr onclick="sv('${id||''}')">Save</button></div>`);tt(ty,1);if(t){$('#cu').value=t.cur||'INR';$('#rt').value=t.cur&&t.cur!='INR'?t.rate:'';$('#ac').value=t.acct||''}if(p){ty=p.type;sel=p.cat;$('#a').value=p.amt;$('#n').value=p.note;if(p.date)$('#d').value=p.date;tt(ty,1)}cr();$('#a').focus()}
function tt(x,k){ty=x;if(!k)sel=x=='income'?'c7':(cat(db.last).id?db.last:db.cats[0].id);$('#be').className=x=='expense'?'on':'';$('#bi').className=x=='income'?'on':'';$('#ch2').innerHTML=db.cats.map(c=>`<button type=button class="chip${c.id==sel?' on':''}" aria-pressed="${c.id==sel}" onclick="sel='${c.id}';tt(ty,1)">${c.icon} ${esc(c.name)}</button>`).join('')}
function sv(id){const a=+$('#a').value,d=$('#d').value;if(!(a>0)||!d||!sel)return $('#er').textContent='Enter an amount above 0, and pick a category and date.';

function bgSv(id){const l=+$('#bl').value,p=$('#bp').value,s=$('#bs2').value,e=$('#be2').value;if(!(l>0)||(p=='custom'&&(!s||!e||e<s)))return $('#er').textContent='Enter a limit above 0 (and a valid start and end date for custom).';const b={id:id||uid(),cat:$('#bc').value,limit:l,per:p,s,e};id?db.bg[db.bg.findIndex(x=>x.id==id)]=b:db.bg.push(b);save();closeS();go()}
function bgDel(id){db.bg=db.bg.filter(x=>x.id!=id);save();closeS();go()}
const hx=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sp'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function setPin(){db.pin?dlg('Remove the PIN?',()=>{db.pin='';save();go()}):dlg('Choose a 4 to 6 digit PIN',async p=>{if(!/^\d{4,6}$/.test(p||''))return toast('PIN must be 4 to 6 digits');db.pin=await hx(p);save();go();toast('PIN set')},'')}
function lock(){if($('#lk'))return;const d=document.createElement('div');d.id='lk';d.setAttribute('role','dialog');d.setAttribute('aria-label','App locked');d.style.cssText='position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-content:center;gap:12px;text-align:center;padding:24px';d.innerHTML='<h2>🔒 Spendly</h2><input id=pn type=password inputmode=numeric autocomplete=off aria-label=PIN placeholder=PIN class=big><p id=pe class=rd></p><button class=pr id=pu>Unlock</button>';document.body.append(d);const u=async()=>{if(await hx($('#pn').value)==db.pin)d.remove();else{$('#pe').textContent='Wrong PIN';$('#pn').value=''}};$('#pu').onclick=u;$('#pn').onkeydown=e=>{if(e.key=='Enter')u()};$('#pn').focus()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db.pin)lock()});
db=mig(db);
try{if(db.al.bill&&window.Notification&&Notification.permission=='granted'&&db.lastN!=today()){const d=db.subs.filter(s=>!s.paused&&days(s.next)<=3);if(d.length){new Notification('Bills due soon',{body:d.map(s=>s.name+' '+fmt(s.amt)).join(', ')});db.lastN=today();save()}}}catch(e){}
th();go('home');if(db.pin)lock();
if('serviceWorker' in navigator)addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
</script></body></html>
